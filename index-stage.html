<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta name="robots" content="noindex, nofollow" />
        <meta charset="utf-8" />
        <title>Staging preview</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; background: #040706; }
            .staticrypt-content {
                min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
                background: radial-gradient(700px 420px at 50% 35%, rgba(60, 242, 106, .12), transparent 70%), #040706;
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9f1ec;
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-page { width: 100%; max-width: 380px; }
            .staticrypt-form {
                background: #0c1611; border: 1px solid #26402f; border-radius: 22px; padding: 36px 30px 30px; text-align: center;
                box-shadow: 0 40px 120px -40px rgba(60, 242, 106, .3);
            }
            .gate-logo { width: 170px; margin: 0 auto 18px; display: block; filter: drop-shadow(0 0 24px rgba(60, 242, 106, .3)); }
            .staticrypt-title { font: 500 12px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #3cf26a; margin: 0 0 10px; }
            .staticrypt-instructions p:last-child { color: #9aaba1; font-size: 14px; margin: 0; }
            .staticrypt-hr { border: 0; border-top: 1px solid #1b2e23; margin: 22px 0; }
            .staticrypt-password-container { position: relative; background: #040706; border: 1px solid #26402f; border-radius: 12px; margin: 0 0 14px; }
            .staticrypt-password-container:focus-within { border-color: #3cf26a; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                background: transparent; border: 0; outline: 0; color: #e9f1ec; font-size: 16px; width: 100%; padding: 14px 44px 14px 14px;
            }
            .staticrypt-toggle-password-visibility { cursor: pointer; height: 18px; width: 18px; opacity: .55; filter: invert(1); position: absolute; right: 13px; top: 50%; transform: translateY(-50%); }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%; border: 0; border-radius: 12px; padding: 14px; cursor: pointer;
                background: #3cf26a; color: #021006; font: 600 15px/1 "Inter", system-ui, sans-serif;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { box-shadow: 0 0 26px rgba(60, 242, 106, .45); }
            label.staticrypt-remember { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: #9aaba1; font-size: 14px; }
            .staticrypt-remember input[type="checkbox"] { accent-color: #3cf26a; width: 16px; height: 16px; margin: 0; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { width: 2rem; height: 2rem; border: .2em solid #3cf26a; border-right-color: transparent; border-radius: 50%; animation: spinner-border .75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
    </head>
